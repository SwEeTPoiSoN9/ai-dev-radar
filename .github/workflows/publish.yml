name: Auto Publish High-Quality Post

on:
  schedule:
    - cron: '0 4,12,20 * * *' # Runs 3 times daily (04:00, 12:00, 20:00 UTC)
  workflow_dispatch: # Allows manual 1-click testing anytime

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Ensures the workflow has the full history, which helps with git diffs
          fetch-depth: 1 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches pip dependencies to speed up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SEO Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit & Push New Post
        run: |
          git config --global user.name "AI Dev Radar Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Stage the new files
          git add content/posts/ data/history.json
          
          # Only commit and push if there are actual changes
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: publish new technical guide [skip ci]"
            git push
          else
            echo "No new changes to commit."
          fi
