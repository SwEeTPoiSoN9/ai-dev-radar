name: Auto Publish High-Quality Post

on:
  schedule:
    - cron: '0 4,12,20 * * *' # Runs 3 times daily (04:00, 12:00, 20:00 UTC)
  workflow_dispatch: # Allows manual 1-click testing anytime

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate SEO Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/bot.py

      - name: Commit & Push New Post
        run: |
          git config --global user.name "AI Dev Radar Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add content/posts/ data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Publish new technical guide" && git push)
